name: Build Windows EXE

on: 
  push:
    branches:
      - main # Or the name of your specific PR branch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Windows Binary
        run: |
          cd go_src/vagrant-vmware-utility
          GOOS=windows GOARCH=amd64 go build -o vagrant-vmware-utility.exe .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vagrant-vmware-utility-windows
          path: go_src/vagrant-vmware-utility/vagrant-vmware-utility.exe
